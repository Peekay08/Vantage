<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Card System</title>
    <link rel="icon" href="../assets/small logo with circle.png">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"></link> 
</head>
<body>
        <div id="login" class="login">
            <img src="../assets/big logo.png" alt="Logo">
            <h2>LOGIN</h2>
            <p>Card Administrator System</p>
            <form id="loginForm" action="submit">
                    <input type="text" id="idNumber" name="idNumber" placeholder="Enter your ID."><br>
                    <input type="password" id="password" name="password" placeholder="Enter your password."> <br>
                    <button type="submit" form="loginForm" value="submit">Login</button><br>
                    <a href="#">Forgot password?</a>
            </form>
            <hr>
            <footer>Vanguard University © 2026</footer>
        </div> 

</body>
</html>
